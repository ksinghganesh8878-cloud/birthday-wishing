<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Birthday Love</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .content {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 4rem;
            color: white;
            margin: 0;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            animation: scaleUp 0.8s ease-out;
        }

        .subtitle {
            font-size: 1.8rem;
            color: #fff;
            margin-top: 15px;
            animation: fadeIn 1.2s ease-in;
        }

        .heart {
            position: fixed;
            font-size: 2rem;
            animation: float-up 3s ease-in forwards;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes float-up {
            0% {
                bottom: 0;
                opacity: 1;
            }
            100% {
                bottom: 100vh;
                opacity: 0;
                transform: translateX(100px) rotate(360deg);
            }
        }

        @keyframes scaleUp {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .button {
            margin-top: 40px;
            padding: 15px 50px;
            font-size: 1.3rem;
            background: #FFD700;
            color: #333;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>💖 Happy Birthday 💖</h1>
        <div class="subtitle">To My Favorite Person!</div>
        <button class="button" onclick="createHearts()">Celebrate! 🎉</button>
    </div>

    <script>
        const hearts = ['💖', '💕', '💗', '💝', '✨', '🎉'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 4000);
        }

        // Auto-create hearts every 500ms
        setInterval(createHeart, 500);

        function createHearts() {
            for (let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 100);
            }
        }
    </script>
</body>
</html>
